spring.application.name=campushub
server.port=${PORT:8080}

spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campushub?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://campushub-frontend-two.vercel.app}